[project]
name = "incidentai-platform"
version = "0.0.1"
description = "IncidentAI platform API (modular monolith)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
